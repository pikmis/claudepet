name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pyinstaller

      - name: Test
        shell: bash
        run: |
          python -m pytest -q --tb=short > pytest.log 2>&1 || {
            cat pytest.log
            echo "::error title=pytest failed::$(tail -c 1800 pytest.log | sed ':a;N;$!ba;s/
/ | /g')"
            exit 1
          }
          tail -n 3 pytest.log

      - name: Build Clawd.exe
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/make_icon.py clawd.ico
          pyinstaller --noconfirm --clean --onefile --noconsole --name Clawd \
            --icon clawd.ico --collect-all soundcard clawd.pyw

      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-windows
          path: dist/Clawd.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Clawd.exe
          generate_release_notes: true
